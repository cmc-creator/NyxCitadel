name: Android app

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor and add the Android project
        working-directory: native
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Set the release version (1.0, versionCode 1)
        working-directory: native/android/app
        run: |
          python3 - << 'PYEOF'
          src = open("build.gradle").read()
          assert "versionCode 1" in src, "versionCode anchor not found in build.gradle"
          assert 'versionName "1.0"' in src, "versionName anchor not found in build.gradle"
          print("release version set: versionCode 1, versionName 1.0")
          PYEOF

      - name: Write the upload keystore from secrets
        working-directory: native/android/app
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > nyxcitadel-upload.jks

      - name: Build the signed AAB
        working-directory: native/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cat >> app/build.gradle << 'GRADLEEOF'

          android {
              signingConfigs {
                  release {
                      storeFile file("nyxcitadel-upload.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEYSTORE_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLEEOF
          ./gradlew bundleRelease

      - name: Upload the AAB
        uses: actions/upload-artifact@v4
        with:
          name: nyxcitadel-aab
          path: native/android/app/build/outputs/bundle/release/app-release.aab
